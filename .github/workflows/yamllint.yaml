---
name: yamllint

on:
  push:
    paths:
      - "**.yaml"
      - "**.yml"
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 3.8 is not available on current ubuntu-latest runners
          python-version: "3.12"
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint . -f parsable
