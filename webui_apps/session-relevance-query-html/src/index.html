<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Asset paths start with ./HOMEPAGE/ like a create-react-app build of the WebUI SDK template.
      The WebUI server rewrites them to /ui_extensions/<name>-<siteId>/ when the extension is installed; keep this form.
      The page's own code is in static/ with no inline <script> or <style>. The analyzer (static/analyzer/) is run
      by analyzer.js as inline scripts, which WebUI's extension CSP allows ('unsafe-inline', 'unsafe-eval').
    -->
    <base href="./HOMEPAGE/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Relevance Query</title>
    <link rel="stylesheet" href="./HOMEPAGE/static/css/app.css" />
    <script defer src="./HOMEPAGE/static/js/analyzer.js"></script>
    <script defer src="./HOMEPAGE/static/js/app.js"></script>
  </head>
  <body>
    <header class="shell-header">
      <a class="shell-back" href="/" title="Back to BigFix WebUI">&larr; BigFix WebUI</a>
      <h1 class="shell-title">Relevance Query</h1>
      <span class="shell-user" id="shell-user"></span>
      <a class="shell-logout" href="/logout">Log out</a>
    </header>

    <main class="srq">
      <label for="srq-input" class="srq-label">Relevance</label>
      <textarea id="srq-input" class="srq-input" spellcheck="false" placeholder="e.g. names of bes computers">(id of it, name of it, operating system of it, last report time of it) of bes computers</textarea>
      <div id="srq-editor" class="srq-editor" hidden></div>
      <div id="srq-analyzer-status" class="srq-analyzer-status srq-muted" role="status">Analyzer: starting...</div>

      <div class="srq-options">
        <label class="srq-inline">Mode
          <select id="srq-mode">
            <option value="auto">Auto (analyzer picks client or session)</option>
            <option value="session">Session relevance</option>
            <option value="client">Client relevance (BigFix Query)</option>
          </select>
        </label>
        <label class="srq-inline">BigFix Query targets
          <input id="srq-targets" class="srq-targets" placeholder="computer ids, e.g. 1234567, 7654321" />
        </label>
        <button type="button" id="srq-fill-target" class="srq-link">Use the 5 most recently reporting computers</button>
      </div>

      <div class="srq-actions">
        <button type="button" id="srq-evaluate" class="srq-button srq-button-primary">Evaluate</button>
        <button type="button" id="srq-copy" class="srq-button" disabled>Copy as TSV</button>
        <span class="srq-hint">Ctrl+Enter to evaluate</span>
      </div>

      <p id="srq-route" class="srq-route" hidden></p>
      <section id="srq-analysis" class="srq-section" hidden></section>
      <section id="srq-session" class="srq-section" hidden></section>
      <section id="srq-client" class="srq-section" hidden></section>
    </main>

    <noscript>This app needs JavaScript.</noscript>
  </body>
</html>
